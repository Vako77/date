<!DOCTYPE html>
<html lang="ka">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Date? ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at 20% 20%, rgba(255,255,255,.5), transparent 30%),
                linear-gradient(135deg, #ffdde1, #ee9ca7);

            overflow: hidden;
        }

        .card {
            width: min(100%, 500px);
            padding: 50px 35px;

            background: rgba(255, 255, 255, 0.92);

            border-radius: 30px;

            text-align: center;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.15);

            position: relative;

            backdrop-filter: blur(10px);

            animation: cardIn .7s ease;
        }

        .heart {
            font-size: clamp(50px, 12vw, 70px);

            animation: pulse 1.2s infinite;
        }

        h1 {
            font-size: clamp(28px, 7vw, 42px);
            line-height: 1.2;

            margin: 15px 0;

            color: #222;
        }

        p {
            font-size: clamp(16px, 4.5vw, 20px);
            line-height: 1.5;

            color: #666;

            margin: 0 0 35px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;

            gap: 15px;

            min-height: 55px;
        }

        button {
            border: none;

            padding: 14px 30px;

            min-width: 110px;

            border-radius: 50px;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;

            transition:
                transform .2s ease,
                box-shadow .2s ease;
        }

        #yes {
            background: #ff4f81;
            color: white;

            box-shadow:
                0 8px 20px rgba(255, 79, 129, 0.3);
        }

        #yes:hover {
            transform: scale(1.08);
        }

        #no {
            background: #eeeeee;
            color: #555;

            position: relative;
        }

        .success {
            display: none;
        }

        .success .big {
            font-size: clamp(55px, 15vw, 80px);

            animation: pulse 1.2s infinite;
        }

        .success h1 {
            color: #ff4f81;
        }

        /* Card animation */

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: scale(.9) translateY(20px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* Heart animation */

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.12);
            }
        }

        /* Confetti */

        .confetti {
            position: fixed;

            top: -50px;

            font-size: 25px;

            pointer-events: none;

            z-index: 9999;

            animation: fall 3s linear forwards;
        }

        @keyframes fall {

            0% {
                transform:
                    translateY(-50px)
                    rotate(0deg);

                opacity: 1;
            }

            100% {
                transform:
                    translateY(110vh)
                    rotate(720deg);

                opacity: 0;
            }
        }

        /* Tablet */

        @media (max-width: 768px) {

            body {
                padding: 15px;
            }

            .card {
                padding: 40px 25px;
                border-radius: 25px;
            }

        }

        /* Mobile */

        @media (max-width: 480px) {

            body {
                padding: 12px;
            }

            .card {
                width: 100%;

                padding:
                    35px
                    18px;

                border-radius: 22px;
            }

            .buttons {
                gap: 10px;
            }

            button {
                padding: 13px 20px;
                min-width: 100px;
                font-size: 16px;
            }

        }

        /* პატარა ტელეფონები */

        @media (max-width: 350px) {

            .card {
                padding:
                    28px
                    14px;
            }

            button {
                min-width: 90px;
                padding: 12px 15px;
            }

        }
    </style>
</head>


<body>

    <div class="card">

        <!-- კითხვა -->

        <div id="question">

            <div class="heart">
                ❤️
            </div>

            <h1>
                დეითზე გამომყვები?
            </h1>

            <p>
                ერთი პატარა კითხვა მაქვს შენთან... 👀
            </p>

            <div class="buttons">

                <button id="yes">
                    კი ❤️
                </button>

                <button id="no">
                    არა 😐
                </button>

            </div>

        </div>


        <!-- წარმატებული პასუხი -->

        <div
            class="success"
            id="success"
        >

            <div class="big">
                🥰❤️
            </div>

            <h1>
                გაემზადეეე!
            </h1>

            <p>
                წავედით! 🚗✨
            </p>

        </div>

    </div>


    <script>

        const noButton =
            document.getElementById("no");

        const yesButton =
            document.getElementById("yes");

        const question =
            document.getElementById("question");

        const success =
            document.getElementById("success");


        /*
        ==========================================
        "არა" ღილაკის გაქცევა
        ==========================================
        */

        function moveButton() {

            const padding = 20;

            const buttonWidth =
                noButton.offsetWidth;

            const buttonHeight =
                noButton.offsetHeight;


            const maxX =
                window.innerWidth -
                buttonWidth -
                padding;

            const maxY =
                window.innerHeight -
                buttonHeight -
                padding;


            const x =
                Math.max(
                    padding,
                    Math.random() * maxX
                );

            const y =
                Math.max(
                    padding,
                    Math.random() * maxY
                );


            noButton.style.position = "fixed";

            noButton.style.left =
                `${x}px`;

            noButton.style.top =
                `${y}px`;

            noButton.style.zIndex = "9999";
        }


        /*
        Desktop:
        მაუსის მიტანისას გაიქცეს
        */

        noButton.addEventListener(
            "mouseenter",
            moveButton
        );


        /*
        Mobile:
        თითით დაჭერისას გაიქცეს
        */

        noButton.addEventListener(
            "touchstart",
            function (event) {

                event.preventDefault();

                moveButton();

            },
            {
                passive: false
            }
        );


        /*
        დამატებით click-ზე გაქცევა.
        */

        noButton.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                moveButton();

            }
        );


        /*
        ==========================================
        "კი" ღილაკი
        ==========================================
        */

        yesButton.addEventListener(
            "click",
            function () {

                question.style.display =
                    "none";

                success.style.display =
                    "block";

                createConfetti();

            }
        );


        /*
        ==========================================
        კონფეტი ❤️✨
        ==========================================
        */

        function createConfetti() {

            const emojis = [
                "❤️",
                "💖",
                "💕",
                "✨",
                "🥰",
                "🎉"
            ];


            for (let i = 0; i < 50; i++) {

                const confetti =
                    document.createElement("div");


                confetti.className =
                    "confetti";


                confetti.textContent =
                    emojis[
                        Math.floor(
                            Math.random() *
                            emojis.length
                        )
                    ];


                confetti.style.left =
                    Math.random() * 100 + "vw";


                confetti.style.animationDuration =
                    (2 + Math.random() * 2) + "s";


                confetti.style.animationDelay =
                    Math.random() * 1.5 + "s";


                document.body.appendChild(
                    confetti
                );


                setTimeout(
                    () => {
                        confetti.remove();
                    },
                    5000
                );

            }
        }

    </script>

</body>

</html>
