<!DOCTYPE html>
<html lang="ka">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date? ❤️</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffdde1, #ee9ca7);
            overflow: hidden;
        }

        .card {
            width: min(90%, 500px);
            min-height: 350px;
            padding: 50px 30px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            position: relative;
        }

        .heart {
            font-size: 70px;
            animation: pulse 1.2s infinite;
        }

        h1 {
            font-size: 42px;
            margin: 15px 0;
            color: #222;
        }

        p {
            font-size: 20px;
            color: #666;
            margin-bottom: 40px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        button {
            border: none;
            padding: 15px 35px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        #yes {
            background: #ff4f81;
            color: white;
            box-shadow: 0 8px 20px rgba(255, 79, 129, 0.3);
        }

        #yes:hover {
            transform: scale(1.08);
        }

        #no {
            background: #eee;
            color: #555;
            position: relative;
        }

        .success {
            display: none;
        }

        .success h1 {
            color: #ff4f81;
        }

        .success .big {
            font-size: 70px;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.12);
            }
        }

        .confetti {
            position: fixed;
            font-size: 25px;
            animation: fall 3s linear forwards;
            pointer-events: none;
        }

        @keyframes fall {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0;
            }
        }

        @media (max-width: 600px) {

            .card {
                width: calc(100% - 30px);
                min-height: auto;
                padding: 40px 20px;
                border-radius: 24px;
            }

            .heart {
                font-size: 55px;
            }

            h1 {
                font-size: 30px;
                line-height: 1.2;
            }

            p {
                font-size: 17px;
                margin-bottom: 30px;
            }

            .buttons {
                gap: 12px;
            }

            button {
                padding: 13px 25px;
                font-size: 16px;
            }

        }
    </style>
</head>

<body>

    <div class="card">

        <!-- პირველი ეკრანი -->
        <div id="question">
            <div class="heart">❤️</div>

            <h1>დეითზე გამომყვები?</h1>

            <p>ერთი პატარა კითხვა მაქვს შენთან... 👀</p>

            <div class="buttons">
                <button id="yes">კი ❤️</button>
                <button id="no">არა 😐</button>
            </div>
        </div>

        <!-- დადებითი პასუხი -->
        <div class="success" id="success">

            <div class="big">🥰❤️</div>

            <h1>გაემზადეეე!</h1>

            <p>წავედით! 🚗✨</p>

        </div>

    </div>

    <script>

        const noButton = document.getElementById("no");
        const yesButton = document.getElementById("yes");

        /*
            "არა" ღილაკი გარბის,
            როცა მაუსს მიიტან.
        */

        noButton.addEventListener("mouseenter", moveButton);

        function moveButton() {

            const padding = 30;

            const maxX = window.innerWidth - noButton.offsetWidth - padding;
            const maxY = window.innerHeight - noButton.offsetHeight - padding;

            const x = Math.random() * maxX;
            const y = Math.random() * maxY;

            noButton.style.position = "fixed";
            noButton.style.left = `${x}px`;
            noButton.style.top = `${y}px`;
        }


        /*
            "კი"-ზე დაჭერისას
            ვაჩვენებთ საბოლოო ეკრანს.
        */

        yesButton.addEventListener("click", () => {

            document.getElementById("question").style.display = "none";
            document.getElementById("success").style.display = "block";

            createConfetti();

        });


        /*
            პატარა კონფეტი 🎉
        */

        function createConfetti() {

            const emojis = ["❤️", "💖", "💕", "✨", "🥰", "🎉"];

            for (let i = 0; i < 40; i++) {

                const confetti = document.createElement("div");

                confetti.className = "confetti";

                confetti.textContent =
                    emojis[Math.floor(Math.random() * emojis.length)];

                confetti.style.left =
                    Math.random() * 100 + "vw";

                confetti.style.animationDuration =
                    (2 + Math.random() * 2) + "s";

                confetti.style.animationDelay =
                    Math.random() * 1.5 + "s";

                document.body.appendChild(confetti);

                setTimeout(() => {
                    confetti.remove();
                }, 4500);
            }
        }

    </script>

</body>
